name: Agent eval

# After a merge to main, and on demand: a real model run with this plugin
# loaded and its own MCP server running sets the team up in a fresh project
# and answers a question for the review seat through devops_brief.
# Needs the repository secret ANTHROPIC_API_KEY; without it the job says so
# and skips. Each run is capped by --max-cost-usd.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case
        default: '1'

permissions:
  contents: read

concurrency:
  group: agent-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Agent sets the project up through the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; the agent eval is skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install the Claude Code CLI
        if: steps.key.outputs.present == 'true'
        run: npm install --global @anthropic-ai/claude-code
      - name: The plugin loads and its MCP server connects
        if: steps.key.outputs.present == 'true'
        run: node scripts/mcp-smoke.mjs --with-claude
      - name: Agent eval (evals/)
        if: steps.key.outputs.present == 'true'
        run: >-
          claude plugin eval . --trust-plugin --no-publish --scaffold --mocks off --ablation none
          --allow-tools "mcp__plugin_devops-multi-agent-team_devops-multi-agent-team__*"
          "mcp__devops-multi-agent-team__devops_brief"
          --runs "${{ github.event.inputs.runs || '1' }}" --threshold 0.75 --max-cost-usd 5
          --json eval-results.json --report eval-report.html
      - name: Keep the results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval
          path: |
            eval-results.json
            eval-report.html
